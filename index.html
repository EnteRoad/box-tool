<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紙箱設計工具 Box Design Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:#f0f0f0;overflow:hidden;height:100vh;width:100vw}
#small-screen-msg{display:none;position:fixed;inset:0;background:#fff;z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:16px;font-size:1.2rem;color:#333}
@media(max-width:1279px){#small-screen-msg{display:flex}#app{display:none}}
#app{display:flex;flex-direction:column;height:100vh;width:100vw}

/* Toolbar */
#toolbar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#ffffff;border-bottom:1px solid #e0e0e0;height:44px;flex-shrink:0;user-select:none}
.tb-group{display:flex;align-items:center;gap:4px;border-right:1px solid #e0e0e0;padding-right:8px;margin-right:4px}
.tb-group:last-child{border-right:none}
.tb-btn{display:flex;align-items:center;justify-content:center;gap:4px;padding:4px 10px;border-radius:5px;border:1px solid #ddd;background:#fff;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-size:12px;color:#333;white-space:nowrap;transition:all 0.15s}
.tb-btn:hover{background:#f5f5f5;border-color:#bbb}
.tb-btn.active{background:#4361EE;color:#fff;border-color:#4361EE}
.tb-btn.cam{background:#f8f8f8}
.tb-btn.cam:hover{background:#eee}
.tb-sep{width:1px;height:20px;background:#e0e0e0;margin:0 4px}
#app-title{font-weight:700;font-size:14px;color:#222;margin-right:8px;font-family:'IBM Plex Mono',monospace}

/* Main area */
#main{display:flex;flex:1;overflow:hidden;position:relative}
#canvas-area{flex:1;position:relative;background:#f8f8f8}
#threejs-canvas{position:absolute;inset:0;width:100%;height:100%}
#svg-area{position:absolute;inset:0;width:100%;height:100%;display:none;background:#fff;overflow:hidden}
#svg-area svg{width:100%;height:100%}

/* Right panel */
#right-panel{width:260px;min-width:200px;max-width:520px;background:#fff;border-left:1px solid #e0e0e0;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto;position:relative}
#panel-resize{position:absolute;left:0;top:0;bottom:0;width:5px;cursor:col-resize;background:transparent;z-index:10}
#panel-resize:hover,#panel-resize.dragging{background:rgba(67,97,238,0.25)}
#right-panel.collapsed{width:32px;overflow:hidden}
#panel-toggle{position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:14px;height:40px;background:#fff;border:1px solid #e0e0e0;border-right:none;border-radius:4px 0 0 4px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:#888}
#panel-inner{padding:12px;position:relative}
.section-title{font-size:11px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.5px;margin:12px 0 6px}
.section-title:first-child{margin-top:0}
.input-row{display:flex;align-items:center;margin-bottom:8px;gap:6px}
.input-row label{width:32px;font-size:12px;color:#555;font-family:'IBM Plex Mono',monospace;font-weight:500;flex-shrink:0}
.input-row input{flex:1;height:30px;border:1px solid #ddd;border-radius:4px;padding:0 8px;font-family:'IBM Plex Mono',monospace;font-size:13px;color:#222;outline:none;transition:border 0.15s}
.input-row input:focus{border-color:#4361EE}
.input-row span{font-size:11px;color:#888;width:20px;flex-shrink:0}
.result-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;padding:2px 0}
.result-label{font-size:11px;color:#888}
.result-val{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#222;font-weight:500}
.result-val.highlight{color:#E63946;font-weight:700}
.export-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:7px;border-radius:5px;border:1px solid #ddd;background:#f8f8f8;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-size:12px;color:#333;margin-bottom:6px;transition:all 0.15s}
.export-btn:hover{background:#eee;border-color:#bbb}
.export-btn.primary{background:#4361EE;color:#fff;border-color:#4361EE}
.export-btn.primary:hover{background:#3451de}
hr.divider{border:none;border-top:1px solid #eee;margin:8px 0}

/* Status bar */
#statusbar{height:28px;background:#222;color:#ccc;display:flex;align-items:center;padding:0 12px;gap:16px;font-family:'IBM Plex Mono',monospace;font-size:11px;flex-shrink:0}
.sb-item{display:flex;align-items:center;gap:6px}
.sb-label{color:#888}
.sb-val{color:#e0e0e0}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:100;display:none;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,0.15);width:560px;max-height:80vh;display:flex;flex-direction:column}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #eee}
.modal-title{font-weight:700;font-size:15px;color:#222}
.modal-close{width:28px;height:28px;border-radius:4px;border:1px solid #eee;background:#f8f8f8;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:#888}
.modal-close:hover{background:#eee}
.modal-body{padding:16px;overflow-y:auto;flex:1}
.search-input{width:100%;height:34px;border:1px solid #ddd;border-radius:5px;padding:0 10px;font-size:13px;margin-bottom:12px;outline:none}
.search-input:focus{border-color:#4361EE}
.box-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box-card{padding:12px;border:1.5px solid #eee;border-radius:6px;cursor:pointer;transition:all 0.15s}
.box-card:hover{border-color:#4361EE;background:#f5f7ff}
.box-card.selected{border-color:#4361EE;background:#edf0ff}
.box-card-code{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#4361EE;font-weight:500;margin-bottom:2px}
.box-card-name{font-weight:700;font-size:13px;color:#222;margin-bottom:2px}
.box-card-desc{font-size:11px;color:#888;line-height:1.4}
.box-icon{width:100%;height:60px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.box-icon svg{max-width:80px;max-height:55px}

/* History panel */
.history-modal{width:440px}
.hist-entry{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #f0f0f0;cursor:pointer;transition:background 0.1s}
.hist-entry:hover{background:#f8f8f8}
.hist-info{flex:1}
.hist-code{font-family:'IBM Plex Mono',monospace;font-size:12px;color:#4361EE;font-weight:500}
.hist-dims{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#888}
.hist-time{font-size:10px;color:#bbb}
.hist-del{width:24px;height:24px;border-radius:3px;border:1px solid #eee;background:#f8f8f8;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#E63946;font-size:12px}
.hist-del:hover{background:#fee}

/* Animation controls */
.anim-row{display:flex;gap:5px;margin-bottom:8px}
.anim-btn{flex:1;padding:5px 4px;border-radius:5px;border:1px solid #ddd;background:#f8f8f8;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-size:11px;color:#333;text-align:center;transition:all 0.15s}
.anim-btn:hover{background:#eee;border-color:#bbb}
.anim-btn.playing{background:#4361EE;color:#fff;border-color:#4361EE}
.fold-track{position:relative;margin-bottom:4px}
.fold-slider{width:100%;height:4px;accent-color:#4361EE;cursor:pointer}
.fold-labels{display:flex;justify-content:space-between;font-size:10px;color:#bbb;margin-top:1px}
.speed-row{display:flex;align-items:center;gap:6px;margin-top:4px}
.speed-row span{font-size:10px;color:#aaa;white-space:nowrap}
.speed-slider{flex:1;height:3px;accent-color:#4361EE;cursor:pointer}
/* Color swatches */
.swatch-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.swatch{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:border 0.15s;flex-shrink:0}
.swatch.active{border-color:#222}
/* Light sliders */
.light-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.light-label{font-size:11px;color:#888;width:38px;flex-shrink:0}
.light-slider{flex:1;height:3px;accent-color:#4361EE;cursor:pointer}

/* Notification */
#notify{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:5px;font-size:13px;opacity:0;pointer-events:none;transition:opacity 0.2s;z-index:9999}

/* ── Parameter table ─────────────────────────────────────── */
.pt-top-ctrl{display:flex;align-items:center;gap:5px;margin-bottom:7px}
.pt-top-label{font-size:11px;color:#555;white-space:nowrap;flex-shrink:0}
.pt-select{height:26px;border:1px solid #ddd;border-radius:4px;font-size:11px;padding:0 4px;background:#fff;cursor:pointer;color:#333;outline:none}
.pt-number{height:26px;border:1px solid #ddd;border-radius:4px;padding:0 5px;font-family:'IBM Plex Mono',monospace;font-size:12px;color:#222;outline:none;transition:border 0.15s;width:70px}
.pt-number:focus{border-color:#4361EE}
.pt-hdr{display:flex;align-items:center;border-bottom:1px solid #e0e0e0;padding-bottom:4px;margin-bottom:3px}
.pt-hdr-layer,.pt-hdr-code,.pt-hdr-desc,.pt-hdr-val{font-size:9px;font-weight:700;color:#aaa;text-transform:uppercase;letter-spacing:0.4px}
.pt-hdr-layer{width:18px;text-align:center;flex-shrink:0}
.pt-hdr-code{width:34px;margin-left:2px;flex-shrink:0}
.pt-hdr-desc{flex:1}
.pt-hdr-val{width:74px;text-align:right}
.pt-row{display:flex;align-items:center;padding:3px 2px;border-radius:3px;cursor:default;transition:background 0.12s}
.pt-row:hover{background:#f5f7ff}
.pt-row.flash{background:#ff6b00;transition:none}
.pt-layer{width:18px;font-size:10px;color:#ccc;text-align:center;flex-shrink:0}
.pt-code{width:34px;font-size:11px;font-family:'IBM Plex Mono',monospace;color:#4361EE;font-weight:500;flex-shrink:0;margin-left:2px}
.pt-desc{flex:1;font-size:11px;color:#555}
.pt-val{width:74px;flex-shrink:0}
.pt-val input{width:100%;height:24px;border:1px solid #ddd;border-radius:3px;padding:0 5px;font-family:'IBM Plex Mono',monospace;font-size:12px;text-align:right;outline:none;transition:border 0.15s;background:#fff;color:#222}
.pt-val input:focus{border-color:#4361EE}
.pt-val input[readonly]{background:#f5f5f5;color:#888;border-color:#eee;cursor:default}
.pt-row.flash .pt-layer,.pt-row.flash .pt-code,.pt-row.flash .pt-desc{color:#fff}
.pt-row.flash .pt-val input{background:#ff8c1a;color:#fff;border-color:#ff8c1a}
.pt-sep{height:1px;background:#f0f0f0;margin:3px 0}
.pt-detail{overflow:hidden;max-height:800px;transition:max-height 0.25s ease}
.pt-detail.hidden{max-height:0}
.toggle-detail-btn{font-size:10px;color:#4361EE;background:none;border:none;cursor:pointer;padding:0;white-space:nowrap;flex-shrink:0}
.toggle-detail-btn:hover{text-decoration:underline}
</style>
</head>
<body>

<div id="small-screen-msg">
  <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1.5"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
  <div style="font-size:1.3rem;font-weight:700;color:#333">請使用較大螢幕</div>
  <div style="color:#888;font-size:0.9rem">本工具需要 1280px 以上的螢幕寬度</div>
</div>

<div id="app">
  <!-- Toolbar -->
  <div id="toolbar">
    <div class="app-title" style="font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;color:#222;margin-right:8px">BOX TOOL</div>
    <div class="tb-group">
      <button class="tb-btn active" id="btn-3d" onclick="setView('3d')">3D 預覽</button>
      <button class="tb-btn" id="btn-svg" onclick="setView('svg')">展開圖</button>
    </div>
    <div class="tb-group">
      <button class="tb-btn cam" onclick="setCam('front')">正面</button>
      <button class="tb-btn cam" onclick="setCam('side')">側面</button>
      <button class="tb-btn cam" onclick="setCam('top')">頂部</button>
      <button class="tb-btn cam" onclick="setCam('flat')">展開</button>
    </div>
    <div class="tb-group">
      <button class="tb-btn" onclick="showLibrary()">📦 箱型庫</button>
      <button class="tb-btn" onclick="showHistory()">🕓 歷史記錄</button>
    </div>
    <div style="flex:1"></div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#aaa" id="box-type-label">FEFCO 0201 / RSC</div>
  </div>

  <!-- Main -->
  <div id="main">
    <div id="canvas-area">
      <canvas id="threejs-canvas"></canvas>
      <div id="svg-area"></div>
    </div>

    <!-- Right panel -->
    <div id="right-panel">
      <div id="panel-resize" title="拖拉調整寬度"></div>
      <div id="panel-inner">
        <!-- 尺寸類型 -->
        <div class="pt-top-ctrl">
          <span class="pt-top-label">尺寸類型</span>
          <select id="dim-type" class="pt-select" style="flex:1">
            <option value="inner">內尺寸</option>
            <option value="die" selected>刀模尺寸</option>
            <option value="outer">外尺寸</option>
          </select>
        </div>
        <!-- 紙厚 -->
        <div class="pt-top-ctrl">
          <span class="pt-top-label">紙厚 (0.01–20)</span>
          <input type="number" id="inp-t" value="3" min="0.01" max="20" step="0.1" class="pt-number" onkeydown="if(event.key==='Enter')submitDims()">
          <select class="pt-select" style="width:42px"><option>mm</option></select>
        </div>
        <!-- 主尺寸單位 + 切換細節 -->
        <div class="pt-top-ctrl" style="justify-content:space-between">
          <div class="pt-top-ctrl" style="margin:0">
            <span class="pt-top-label">主尺寸單位</span>
            <select class="pt-select" style="width:52px"><option>mm</option></select>
          </div>
          <button class="toggle-detail-btn" id="btn-toggle-detail" onclick="toggleDetailParams()">隱藏細節參數</button>
        </div>

        <!-- Table header -->
        <div class="pt-hdr">
          <span class="pt-hdr-layer">層</span>
          <span class="pt-hdr-code">代號</span>
          <span class="pt-hdr-desc">描述</span>
          <span class="pt-hdr-val">值</span>
        </div>

        <!-- Layer 1: main dims (always visible) -->
        <div class="pt-row" id="pr-L" data-param="L">
          <span class="pt-layer">1</span><span class="pt-code">L</span>
          <span class="pt-desc">長</span>
          <span class="pt-val"><input type="number" id="inp-L" value="300" min="10" max="5000" onkeydown="if(event.key==='Enter')submitDims()"></span>
        </div>
        <div class="pt-row" id="pr-W" data-param="W">
          <span class="pt-layer">1</span><span class="pt-code">W</span>
          <span class="pt-desc">寬</span>
          <span class="pt-val"><input type="number" id="inp-W" value="200" min="10" max="5000" onkeydown="if(event.key==='Enter')submitDims()"></span>
        </div>
        <div class="pt-row" id="pr-D" data-param="D">
          <span class="pt-layer">1</span><span class="pt-code">D</span>
          <span class="pt-desc">高</span>
          <span class="pt-val"><input type="number" id="inp-H" value="150" min="10" max="5000" onkeydown="if(event.key==='Enter')submitDims()"></span>
        </div>

        <div class="pt-sep"></div>

        <!-- Detail params (layers 2+, toggleable) -->
        <div class="pt-detail" id="pt-detail-section">
          <div class="pt-row" id="pr-of" data-param="of">
            <span class="pt-layer">2</span><span class="pt-code">of</span>
            <span class="pt-desc">高低位</span>
            <span class="pt-val"><input type="number" id="inp-of" value="1" min="0" max="20" step="0.5" onkeydown="if(event.key==='Enter')submitDims()"></span>
          </div>
          <div class="pt-row" id="pr-g" data-param="g">
            <span class="pt-layer">2</span><span class="pt-code">g</span>
            <span class="pt-desc">黏位長</span>
            <span class="pt-val" style="display:flex;gap:4px;align-items:center">
              <input type="checkbox" id="chk-g" checked title="啟用黏位" style="margin:0;cursor:pointer" onchange="toggleGlueTab(this.checked)">
              <input type="number" id="inp-g" value="30" min="5" max="100" onkeydown="if(event.key==='Enter')submitDims()">
            </span>
          </div>
          <div class="pt-sep"></div>
          <div class="pt-row" id="pr-f" data-param="f">
            <span class="pt-layer">3</span><span class="pt-code">f</span>
            <span class="pt-desc">翼深 (0=自動)</span>
            <span class="pt-val"><input type="number" id="inp-f" value="0" min="0" max="500" onkeydown="if(event.key==='Enter')submitDims()"></span>
          </div>
          <div class="pt-row" id="pr-sl" data-param="sl">
            <span class="pt-layer">3</span><span class="pt-code">sl</span>
            <span class="pt-desc">開槽寬 (0=自動)</span>
            <span class="pt-val"><input type="number" id="inp-sl" value="0" min="0" max="50" step="0.5" onkeydown="if(event.key==='Enter')submitDims()"></span>
          </div>
          <div class="pt-sep"></div>
          <!-- Calculated read-only outputs -->
          <div class="pt-row" id="pr-mfgW" data-param="mfgW">
            <span class="pt-layer">4</span><span class="pt-code">mW</span>
            <span class="pt-desc">製造寬</span>
            <span class="pt-val"><input id="out-mfgW" readonly value="—"></span>
          </div>
          <div class="pt-row" id="pr-mfgH" data-param="mfgH">
            <span class="pt-layer">4</span><span class="pt-code">mH</span>
            <span class="pt-desc">製造高</span>
            <span class="pt-val"><input id="out-mfgH" readonly value="—"></span>
          </div>
        </div>

        <button id="btn-submit" class="export-btn primary" style="margin-top:6px" onclick="submitDims()">調參</button>

        <hr class="divider">
        <div class="section-title">3D 折疊動畫</div>
        <div class="anim-row">
          <button class="anim-btn" id="btn-play" onclick="toggleFoldAnim()">▶ 播放</button>
          <button class="anim-btn" onclick="resetFoldAnim()">↺ 重置</button>
          <button class="anim-btn" id="btn-autospin" onclick="toggleAutoSpin()">⟳ 旋轉</button>
        </div>
        <div class="fold-track">
          <input type="range" class="fold-slider" id="fold-slider" min="0" max="100" value="0" oninput="onFoldSlider(this.value)">
          <div class="fold-labels"><span>開蓋</span><span>合蓋</span></div>
        </div>
        <div class="speed-row">
          <span>速度 慢</span>
          <input type="range" class="speed-slider" id="speed-slider" min="0.4" max="4" step="0.1" value="1.5">
          <span>快</span>
        </div>

        <hr class="divider">
        <div class="section-title">紙板顏色</div>
        <div class="swatch-row" id="color-swatches"></div>

        <hr class="divider">
        <div class="section-title">燈光</div>
        <div class="light-row">
          <span class="light-label">全局光</span>
          <input type="range" class="light-slider" id="light-amb" min="0" max="2.5" step="0.05" value="0.7" oninput="updateLights()">
        </div>
        <div class="light-row">
          <span class="light-label">泛光</span>
          <input type="range" class="light-slider" id="light-dir" min="0" max="2.5" step="0.05" value="0.8" oninput="updateLights()">
        </div>

        <hr class="divider">
        <div class="section-title">匯出</div>
        <button class="export-btn primary" onclick="exportSVG()">⬇ 匯出 SVG</button>
        <button class="export-btn" onclick="exportDXF()">⬇ 匯出 DXF</button>
        <button class="export-btn" onclick="exportPDF()">⬇ 匯出 PDF</button>
      </div>
    </div>
  </div>

  <!-- Status bar -->
  <div id="statusbar">
    <div class="sb-item"><span class="sb-label">箱型</span><span class="sb-val" id="sb-code">FEFCO 0201</span></div>
    <div class="sb-item"><span class="sb-label">製造尺寸</span><span class="sb-val" id="sb-mfg">—</span></div>
    <div class="sb-item"><span class="sb-label">外部尺寸</span><span class="sb-val" id="sb-ext">—</span></div>
  </div>
</div>

<!-- Box Library Modal -->
<div class="overlay" id="overlay-lib">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">箱型庫 Box Library</span>
      <button class="modal-close" onclick="closeOverlay('overlay-lib')">✕</button>
    </div>

</div>

      </div>

<!-- Notification -->
<div id="notify"></div>

<script>
// ============================================================
// BOX DEFINITIONS
// ============================================================
const BOX_LIBRARY = [
  {
    code: 'FEFCO-0201',
    label: 'FEFCO 0201 / RSC',
    nameCN: '對插蓋紙箱',
    nameEN: 'Regular Slotted Container',
    desc: '最常見的瓦楞紙箱型，四片側板加上頂底蓋翼。',
    calc(L, W, H, CAL, extra = {}) {
      const { of: ofVal = 1, gTab = 30, f: fOverride = 0, sl: slOverride = 0 } = extra;
      // Flap depth: user override or W/2 (flaps close across the W direction)
      const flapH_auto = Math.round(W / 2);
      const flapH      = fOverride > 0 ? fOverride : flapH_auto;
      // Flap widths (minor = floor(W/2) - ofVal, major = ceil(W/2))
      const flapW_minor = Math.floor(W / 2) - ofVal;   // short-side (B panels), slightly shorter
      const flapW_major = Math.ceil(W / 2);             // long-side  (A panels)
      // Slot width between adjacent flaps — clamp to at most 1/3 of narrower panel
      const slotRaw = slOverride > 0 ? slOverride : CAL + 2;
      const slotW = Math.min(slotRaw, Math.floor(Math.min(L, W) / 3));
      // Panel dimensions
      const panelA_w = L + CAL;
      const panelA_h = H + 2 * CAL;
      const panelB_w = W + CAL;
      // Glue tab
      const glue = gTab > 0 ? Math.max(gTab, CAL + 5) : 0;
      // Manufacturing blank size
      const mfgW = panelA_w * 2 + panelB_w * 2 + glue;
      const mfgH = flapH + panelA_h + flapH;
      const extL = L + 2 * CAL;
      const extW = W + 2 * CAL;
      const extH = H + 2 * CAL;
      return {
        panelA_w, panelA_h, panelB_w,
        flapW_minor, flapW_major, flapH, slotW, glue,
        // keep old names for backward compat
        flapW_inner: flapW_minor, flapW_outer: flapW_major,
        mfgW, mfgH, extL, extW, extH,
        rows: [
          ['面板 A 寬', panelA_w],
          ['面板 B 寬', panelB_w],
          ['面板高', panelA_h],
          ['蓋翼(A)', flapW_major],
          ['蓋翼(B)', flapW_minor],
          ['蓋翼高', flapH],
          ['開槽寬', slotW],
          ['黏位', glue],
          ['製造寬', mfgW, true],
          ['製造高', mfgH, true],
        ]
      };
    },
    svgGen(L, W, H, CAL, vw, vh, extra) {
      return gen0201SVG(L, W, H, CAL, vw, vh, extra);
    },
    build3D(L, W, H, CAL, scene, fVal) {
      return build0201_3D(L, W, H, CAL, scene, fVal);
    }
  },
  {
    code: 'ONE-PIECE',
    label: '一體式外箱',
    nameCN: '一體式外箱',
    nameEN: 'One-Piece Integrated Lid Box',
    desc: '頂部兩片大翼全覆蓋（深度=W），底部標準RSC。適合機器自動開箱。',
    calc(L, W, H, CAL, extra = {}) {
      const { of: ofVal = 0, gTab = 30, f: fOverride = 0, sl: slOverride = 0 } = extra;
      const glue     = gTab > 0 ? Math.max(gTab, CAL + 5) : 0;
      const slotRaw  = slOverride > 0 ? slOverride : CAL + 2;
      const slotW    = Math.min(slotRaw, Math.floor(Math.min(L, W) / 3));
      const panelA_w = L + CAL;
      const panelA_h = H + 2 * CAL;
      const panelB_w = W + CAL;
      // Top: A flap = W (full coverage), B = dust flap; user can override A depth via f
      const topFlap_A = fOverride > 0 ? fOverride : W;
      const dustH     = Math.max(20, Math.round(W / 6));
      // Bottom: standard RSC with of
      const botFlap_A  = Math.round(W / 2);
      const botFlapMin = Math.max(botFlap_A - ofVal, 1);
      const flatW = glue + panelA_w + panelB_w + panelA_w + panelB_w;
      const flatH = topFlap_A + panelA_h + botFlap_A;
      const mfgW  = flatW;
      const mfgH  = flatH;
      return {
        glue, slotW, panelA_w, panelA_h, panelB_w,
        topFlap_A, dustH, botFlap_A, botFlapMin,
        flatW, flatH, mfgW, mfgH,
        rows: [
          ['面板 A 寬', panelA_w],
          ['面板 B 寬', panelB_w],
          ['面板高',    panelA_h],
          ['頂翼A(大)', topFlap_A],
          ['頂翼B(塵)', dustH],
          ['底翼(A)',   botFlap_A],
          ['底翼(B)',   botFlapMin],
          ['開槽寬',    slotW],
          ['黏位',      glue],
          ['製造寬',    mfgW, true],
          ['製造高',    mfgH, true],
        ]
      };
    },
    svgGen(L, W, H, CAL, vw, vh, extra) {
      return genOnePieceSVG(L, W, H, CAL, vw, vh, extra);
    },
    build3D(L, W, H, CAL, scene) {
      return buildOnePiece3D(L, W, H, CAL, scene);
    }
  }
];

let currentBoxIdx = 0;
let currentView = '3d';
let calcData = null;

// ============================================================
// STATE
// ============================================================
function getInputs() {
  const g = id => { const el = document.getElementById(id); return el ? parseFloat(el.value) : NaN; };
  const glueEnabled = document.getElementById('chk-g') ? document.getElementById('chk-g').checked : true;
  return {
    L:   g('inp-L')  || 300,
    W:   g('inp-W')  || 200,
    H:   g('inp-H')  || 150,
    CAL: g('inp-t')  || 3,
    of:  isNaN(g('inp-of'))  ? 1  : (g('inp-of')  || 0),
    gTab: glueEnabled ? (isNaN(g('inp-g')) ? 30 : (g('inp-g') || 30)) : 0,
    f:   isNaN(g('inp-f'))   ? 0  : (g('inp-f')   || 0),
    sl:  isNaN(g('inp-sl'))  ? 0  : (g('inp-sl')  || 0),
  };
}

function toggleGlueTab(enabled) {
  const inp = document.getElementById('inp-g');
  if (inp) { inp.disabled = !enabled; inp.style.opacity = enabled ? '' : '0.35'; }
  submitDims();
}

// ============================================================
// CALCULATE & RENDER
// ============================================================
function onInputChange() {
  // Mark the submit button as "pending" so user knows dims changed
  const btn = document.getElementById('btn-submit');
  if (btn) { btn.textContent = '生成 ●'; btn.style.background = '#E63946'; btn.style.borderColor = '#E63946'; }
}

function submitDims() {
  const btn = document.getElementById('btn-submit');
  if (btn) { btn.textContent = '生成'; btn.style.background = ''; btn.style.borderColor = ''; }
  updateAll();
}

function updateAll() {
  // Kill any running fold animation when dimensions change
  if (_foldTween) { _foldTween.kill(); _foldTween = null; }
  const btnPlay = document.getElementById('btn-play');
  if (btnPlay) { btnPlay.textContent = '▶ 播放'; btnPlay.classList.remove('playing'); }
  window._flapPivots = null;
  window._wallPivots = null;
  window._hinges     = null;

  const { L, W, H, CAL, of: ofVal, gTab, f: fVal, sl: slVal } = getInputs();
  const box = BOX_LIBRARY[currentBoxIdx];
  calcData = box.calc(L, W, H, CAL, { of: ofVal, gTab, f: fVal, sl: slVal });

  // Update read-only calc output rows
  const mfgW = calcData.mfgW || calcData.mfgW_lid || '—';
  const mfgH = calcData.mfgH || calcData.mfgH_lid || '—';
  const elMfgW = document.getElementById('out-mfgW');
  const elMfgH = document.getElementById('out-mfgH');
  if (elMfgW) elMfgW.value = mfgW;
  if (elMfgH) elMfgH.value = mfgH;

  // Status bar
  document.getElementById('sb-code').textContent = box.code.replace('-', ' ');
  document.getElementById('box-type-label').textContent = box.label;
  document.getElementById('sb-mfg').textContent = `${mfgW} × ${mfgH} mm`;
  document.getElementById('sb-ext').textContent = `${calcData.extL} × ${calcData.extW} × ${calcData.extH} mm`;

  // SVG / 3D
  if (currentView === 'svg') renderSVG();
  else render3D();

  saveHistory(L, W, H, CAL, box.code);
}

// ============================================================
// SVG RENDERING
// ============================================================
function renderSVG() {
  const svgArea = document.getElementById('svg-area');
  const { L, W, H, CAL, of: ofVal, gTab, f: fVal, sl: slVal } = getInputs();
  const box = BOX_LIBRARY[currentBoxIdx];
  const vw = svgArea.clientWidth || 800;
  const vh = svgArea.clientHeight || 600;
  try {
    svgArea.innerHTML = box.svgGen(L, W, H, CAL, vw, vh, { of: ofVal, gTab, f: fVal, sl: slVal });
  } catch(e) {
    svgArea.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${vw}" height="${vh}">
      <text x="20" y="40" font-size="13" fill="#E63946" font-family="monospace">SVG 錯誤: ${e.message}</text></svg>`;
    console.error('renderSVG error:', e);
  }
}

// SVG helper: scale flat diagram to viewport
function calcScale(flatW, flatH, vw, vh, margin) {
  margin = margin || 60;
  const scaleX = (vw - margin * 2) / flatW;
  const scaleY = (vh - margin * 2) / flatH;
  const scale = Math.min(scaleX, scaleY, 1.5);
  const ox = (vw - flatW * scale) / 2;
  const oy = (vh - flatH * scale) / 2;
  return { scale, ox, oy };
}

function svgLine(x1, y1, x2, y2, layer) {
  if (layer === 'cut') return `<line x1="${r(x1)}" y1="${r(y1)}" x2="${r(x2)}" y2="${r(y2)}" stroke="#E63946" stroke-width="1.2" fill="none"/>`;
  return `<line x1="${r(x1)}" y1="${r(y1)}" x2="${r(x2)}" y2="${r(y2)}" stroke="#4361EE" stroke-width="1" stroke-dasharray="5,3" fill="none"/>`;
}

function svgRect(x, y, w, h, layer) {
  const lines = [
    svgLine(x, y, x+w, y, layer),
    svgLine(x+w, y, x+w, y+h, layer),
    svgLine(x+w, y+h, x, y+h, layer),
    svgLine(x, y+h, x, y, layer),
  ];
  return lines.join('');
}

// svgDim — dimension annotation, optionally clickable (paramCode links to right-panel row)
function svgDim(x1, y1, x2, y2, label, outside, paramCode) {
  const mx = (x1+x2)/2, my = (y1+y2)/2;
  const isH = Math.abs(y2-y1) < 2;
  const tx = isH ? mx : mx - (outside ? 32 : -32);
  const ty = isH ? my - (outside ? 14 : -14) : my;
  const fill   = paramCode ? '#4361EE' : '#888';
  const weight = paramCode ? '600' : '400';
  const clk    = paramCode
    ? ` onclick="highlightParam('${paramCode}')" style="cursor:pointer"`
    : '';
  const bg = paramCode
    ? `<rect x="${r(tx-20)}" y="${r(ty-7)}" width="40" height="13" rx="3"
           fill="rgba(67,97,238,0.08)"
           onmouseover="this.setAttribute('fill','rgba(67,97,238,0.2)')"
           onmouseout="this.setAttribute('fill','rgba(67,97,238,0.08)')"/>`
    : '';
  return `<line x1="${r(x1)}" y1="${r(y1)}" x2="${r(x2)}" y2="${r(y2)}" stroke="#bbb" stroke-width="0.6"/>
<g${clk}>${bg}<text x="${r(tx)}" y="${r(ty)}" text-anchor="middle" dominant-baseline="middle"
  font-size="9" font-family="IBM Plex Mono,monospace" fill="${fill}" font-weight="${weight}">${label}</text></g>`;
}

function r(n) { return Math.round(n * 10) / 10; }

// ---- FEFCO 0201 SVG ----
function gen0201SVG(L, W, H, CAL, vw, vh, extra) {
  extra = extra || {};
  const { of: ofVal = 1 } = extra;
  const d = BOX_LIBRARY[0].calc(L, W, H, CAL, extra);
  const { panelA_w, panelA_h, panelB_w, flapH, flapW_minor, flapW_major, slotW, glue } = d;

  // Blank layout (left→right):
  //  [glue tab] [A1: L+CAL] [B1: W+CAL] [A2: L+CAL] [B2: W+CAL]
  // Flap zone top + bottom = flapH each
  // The first column (glue) sits to the LEFT of A1.
  const flatW = glue + panelA_w + panelB_w + panelA_w + panelB_w;
  const flatH = flapH + panelA_h + flapH;

  const { scale, ox, oy } = calcScale(flatW, flatH, vw, vh, 80);
  const s  = v => v * scale;
  const tx = v => ox + v * scale;
  const ty = v => oy + v * scale;

  // X column boundaries (mm, unscaled)
  const xGlue = 0;
  const xA1   = glue;
  const xB1   = xA1 + panelA_w;
  const xA2   = xB1 + panelB_w;
  const xB2   = xA2 + panelA_w;
  const xEnd  = xB2 + panelB_w;   // = flatW

  // Y row boundaries
  const yPanel  = flapH;
  const yBotF   = flapH + panelA_h;
  // Major flaps (A panels + glue): full flapH; minor flaps (B panels): flapH - ofVal
  const flapMin = Math.max(flapH - ofVal, 1);
  const yTopMaj = 0;
  const yTopMin = flapH - flapMin;   // = ofVal (but clamped)
  const yBotMaj = flatH;
  const yBotMin = flatH - (flapH - flapMin);

  let cuts = '', folds = '', dims = '';

  // ── Outer cut boundary — stepped profile showing high-low flap heights ──
  // Top perimeter (left→right): glue tab has no flaps, so boundary steps at xA1
  cuts += svgLine(tx(xA1),   ty(yPanel),  tx(xA1),  ty(yTopMaj), 'cut');  // step up at glue/A1
  cuts += svgLine(tx(xA1),   ty(yTopMaj), tx(xB1),  ty(yTopMaj), 'cut');
  cuts += svgLine(tx(xB1),   ty(yTopMaj), tx(xB1),  ty(yTopMin), 'cut');
  cuts += svgLine(tx(xB1),   ty(yTopMin), tx(xA2),  ty(yTopMin), 'cut');
  cuts += svgLine(tx(xA2),   ty(yTopMin), tx(xA2),  ty(yTopMaj), 'cut');
  cuts += svgLine(tx(xA2),   ty(yTopMaj), tx(xB2),  ty(yTopMaj), 'cut');
  cuts += svgLine(tx(xB2),   ty(yTopMaj), tx(xB2),  ty(yTopMin), 'cut');
  cuts += svgLine(tx(xB2),   ty(yTopMin), tx(xEnd), ty(yTopMin), 'cut');
  // Right edge
  cuts += svgLine(tx(xEnd),  ty(yTopMin), tx(xEnd), ty(yBotMin), 'cut');
  // Bottom perimeter (right→left)
  cuts += svgLine(tx(xEnd),  ty(yBotMin), tx(xB2),  ty(yBotMin), 'cut');
  cuts += svgLine(tx(xB2),   ty(yBotMin), tx(xB2),  ty(yBotMaj), 'cut');
  cuts += svgLine(tx(xB2),   ty(yBotMaj), tx(xA2),  ty(yBotMaj), 'cut');
  cuts += svgLine(tx(xA2),   ty(yBotMaj), tx(xA2),  ty(yBotMin), 'cut');
  cuts += svgLine(tx(xA2),   ty(yBotMin), tx(xB1),  ty(yBotMin), 'cut');
  cuts += svgLine(tx(xB1),   ty(yBotMin), tx(xB1),  ty(yBotMaj), 'cut');
  cuts += svgLine(tx(xB1),   ty(yBotMaj), tx(xA1),  ty(yBotMaj), 'cut');  // A1 flap bottom
  cuts += svgLine(tx(xA1),   ty(yBotMaj), tx(xA1),  ty(yBotF),   'cut');  // step down at glue/A1
  // Glue tab perimeter — body-height rectangle only (no flaps)
  cuts += svgLine(tx(xA1),   ty(yBotF),   tx(xGlue),ty(yBotF),   'cut');  // glue tab bottom
  cuts += svgLine(tx(xGlue), ty(yBotF),   tx(xGlue),ty(yPanel),  'cut');  // glue tab left edge
  cuts += svgLine(tx(xGlue), ty(yPanel),  tx(xA1),  ty(yPanel),  'cut');  // glue tab top

  // ── Vertical fold lines (panel dividers, body zone only) ──────────────
  [xA1, xB1, xA2, xB2].forEach(x => {
    folds += svgLine(tx(x), ty(yPanel), tx(x), ty(yBotF), 'fold');
  });

  // ── Horizontal fold lines (flap hinges) — start at xA1, glue tab has no flaps ──
  folds += svgLine(tx(xA1),   ty(yPanel), tx(xEnd), ty(yPanel), 'fold');
  folds += svgLine(tx(xA1),   ty(yBotF),  tx(xEnd), ty(yBotF),  'fold');

  // ── Slot cuts — left/right lines differ in depth for A/B boundaries ────
  // [position, leftIsMajor, rightIsMajor]
  const slotDefs = [
    // xA1 slot removed — glue tab has no flaps; outer boundary step at xA1 already separates them
    [xB1, true,  false],   // A1  ↔ B1
    [xA2, false, true ],   // B1  ↔ A2
    [xB2, true,  false],   // A2  ↔ B2
  ];
  slotDefs.forEach(([px, lMaj, rMaj]) => {
    const sx = tx(px), sw = s(slotW / 2);
    cuts += svgLine(sx - sw, ty(yPanel), sx - sw, ty(lMaj ? yTopMaj : yTopMin), 'cut');
    cuts += svgLine(sx + sw, ty(yPanel), sx + sw, ty(rMaj ? yTopMaj : yTopMin), 'cut');
    cuts += svgLine(sx - sw, ty(yBotF),  sx - sw, ty(lMaj ? yBotMaj : yBotMin), 'cut');
    cuts += svgLine(sx + sw, ty(yBotF),  sx + sw, ty(rMaj ? yBotMaj : yBotMin), 'cut');
  });

  // ── Dimension annotations ─────────────────────────────────────────────
  const DY = 14;  // offset above/below blank for dims

  // Overall blank width (total)
  dims += svgDim(tx(xGlue), ty(yTopMaj)-DY, tx(xEnd), ty(yTopMaj)-DY,
    `${r(flatW)} mm`, true);

  // Overall blank height (right side, major height)
  dims += svgDim(tx(xEnd)+DY, ty(yTopMaj), tx(xEnd)+DY, ty(yBotMaj),
    `${r(flatH)} mm`, false);

  // Panel widths — annotated inside each panel at mid-height
  dims += svgDim(tx(xA1), ty(yPanel + panelA_h/2),
                 tx(xB1), ty(yPanel + panelA_h/2),
                 `${L}`, false, 'L');
  dims += svgDim(tx(xB1), ty(yPanel + panelA_h/2),
                 tx(xA2), ty(yPanel + panelA_h/2),
                 `${W}`, false, 'W');
  dims += svgDim(tx(xA2), ty(yPanel + panelA_h/2),
                 tx(xB2), ty(yPanel + panelA_h/2),
                 `${L}`, false, 'L');
  dims += svgDim(tx(xB2), ty(yPanel + panelA_h/2),
                 tx(xEnd), ty(yPanel + panelA_h/2),
                 `${W}`, false, 'W');

  // Panel height = H (clickable → D)
  dims += svgDim(tx(xA1)-DY, ty(yPanel), tx(xA1)-DY, ty(yBotF),
                 `${H}`, true, 'D');

  // Top flap height — major (A) shown on left, minor (B) shown above B1
  dims += svgDim(tx(xA1)-DY, ty(yTopMaj), tx(xA1)-DY, ty(yPanel),
                 `${flapH}`, true, 'f');
  if (ofVal > 0) {
    dims += svgDim(tx(xB1)+4, ty(yTopMin), tx(xB1)+4, ty(yPanel),
                   `${flapMin}`, false, 'of');
  }

  // Glue tab width (clickable → g) — annotated above the glue tab top edge
  dims += svgDim(tx(xGlue), ty(yPanel)-DY, tx(xA1), ty(yPanel)-DY,
                 `g:${glue}`, true, 'g');

  // Slot width annotation on top slot at xB1
  dims += svgDim(tx(xB1 - slotW/2), ty(yTopMin + (yPanel - yTopMin)/2),
                 tx(xB1 + slotW/2), ty(yTopMin + (yPanel - yTopMin)/2),
                 `sl:${r(slotW)}`, false, 'sl');


  return `<svg xmlns="http://www.w3.org/2000/svg" width="${vw}" height="${vh}" style="background:#fff">
  <g id="dims">${dims}</g>
  <g id="fold">${folds}</g>
  <g id="cut">${cuts}</g>
  <text x="${vw/2}" y="14" text-anchor="middle" font-size="11"
    font-family="IBM Plex Mono,monospace" fill="#bbb">FEFCO 0201 RSC — L${L}×W${W}×D${H} t${CAL}mm</text>
</svg>`;
}

// ---- Open Tray SVG (淺盤) ----
function genTraySVG(L, W, H, CAL, vw, vh, extra) {
  extra = extra || {};
  const wH = H + CAL;
  const bL = L + 2 * CAL;
  const bW = W + 2 * CAL;
  const flatW = bL + 2 * wH;
  const flatH = bW + 2 * wH;

  const { scale, ox, oy } = calcScale(flatW, flatH, vw, vh, 80);
  const s  = v => v * scale;
  const tx = v => ox + v * scale;
  const ty = v => oy + v * scale;

  const x0 = 0, x1 = wH, x2 = wH + bL, x3 = flatW;
  const y0 = 0, y1 = wH, y2 = wH + bW, y3 = flatH;

  let cuts = '', folds = '', dims = '';

  // Outer cut boundary — cross/plus shape (cut corners)
  cuts += svgLine(tx(x1), ty(y0), tx(x2), ty(y0), 'cut');  // top
  cuts += svgLine(tx(x3), ty(y1), tx(x3), ty(y2), 'cut');  // right
  cuts += svgLine(tx(x1), ty(y3), tx(x2), ty(y3), 'cut');  // bottom
  cuts += svgLine(tx(x0), ty(y1), tx(x0), ty(y2), 'cut');  // left
  // Corner notches
  cuts += svgLine(tx(x1), ty(y0), tx(x1), ty(y1), 'cut');
  cuts += svgLine(tx(x0), ty(y1), tx(x1), ty(y1), 'cut');
  cuts += svgLine(tx(x2), ty(y0), tx(x2), ty(y1), 'cut');
  cuts += svgLine(tx(x3), ty(y1), tx(x2), ty(y1), 'cut');
  cuts += svgLine(tx(x1), ty(y3), tx(x1), ty(y2), 'cut');
  cuts += svgLine(tx(x0), ty(y2), tx(x1), ty(y2), 'cut');
  cuts += svgLine(tx(x2), ty(y3), tx(x2), ty(y2), 'cut');
  cuts += svgLine(tx(x3), ty(y2), tx(x2), ty(y2), 'cut');

  // Fold lines
  folds += svgLine(tx(x1), ty(y1), tx(x2), ty(y1), 'fold');
  folds += svgLine(tx(x1), ty(y2), tx(x2), ty(y2), 'fold');
  folds += svgLine(tx(x1), ty(y1), tx(x1), ty(y2), 'fold');
  folds += svgLine(tx(x2), ty(y1), tx(x2), ty(y2), 'fold');

  // Dimension annotations
  const DY = 14;
  dims += svgDim(tx(x1), ty(y0)-DY, tx(x2), ty(y0)-DY, `${r(flatW)} mm`, true);
  dims += svgDim(tx(x3)+DY, ty(y0), tx(x3)+DY, ty(y3), `${r(flatH)} mm`, false);
  dims += svgDim(tx(x1)-DY, ty(y1), tx(x1)-DY, ty(y2), `${W}`, true, 'W');
  dims += svgDim(tx(x1), ty(y1 + (y2-y1)/2), tx(x2), ty(y1 + (y2-y1)/2), `${L}`, false, 'L');
  dims += svgDim(tx(x1)-DY, ty(y0), tx(x1)-DY, ty(y1), `${r(wH)}`, true, 'D');

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${vw}" height="${vh}" style="background:#fff">
  <g id="dims">${dims}</g>
  <g id="fold">${folds}</g>
  <g id="cut">${cuts}</g>
  <text x="${vw/2}" y="14" text-anchor="middle" font-size="11"
    font-family="IBM Plex Mono,monospace" fill="#bbb">淺盤 Open Tray — L${L}×W${W}×H${H} t${CAL}mm</text>
</svg>`;
}

// ---- Mailer Box SVG (飛機盒) ----
function genMailerSVG(L, W, H, CAL, vw, vh, extra) {
  extra = extra || {};
  const { gTab = 30 } = extra;
  const panelA = L + CAL;
  const panelB = W + CAL;
  const glue   = gTab > 0 ? Math.max(gTab, CAL + 5) : 0;
  const bodyH  = H + 2 * CAL;
  const topH   = Math.round(W / 2);
  const botH   = Math.round(W / 2);
  const flatW  = 2 * panelA + 2 * panelB + glue;
  const flatH  = topH + bodyH + botH;

  const { scale, ox, oy } = calcScale(flatW, flatH, vw, vh, 80);
  const s  = v => v * scale;
  const tx = v => ox + v * scale;
  const ty = v => oy + v * scale;

  // X positions (same as 0201)
  const xG  = 0;
  const xA1 = glue;
  const xB1 = xA1 + panelA;
  const xA2 = xB1 + panelB;
  const xB2 = xA2 + panelA;
  const xEnd = xB2 + panelB;

  // Y positions
  const yTop  = 0;
  const yBody = topH;
  const yBotF = topH + bodyH;
  const yEnd  = flatH;

  let cuts = '', folds = '', dims = '';

  // ── Outer boundary (stepped: B-panel flaps can be shorter with of offset,
  //    for simplicity use uniform height here)
  cuts += svgLine(tx(xG),  ty(yTop),  tx(xEnd), ty(yTop),  'cut'); // top
  cuts += svgLine(tx(xEnd),ty(yTop),  tx(xEnd), ty(yEnd),  'cut'); // right
  cuts += svgLine(tx(xEnd),ty(yEnd),  tx(xG),   ty(yEnd),  'cut'); // bottom
  cuts += svgLine(tx(xG),  ty(yEnd),  tx(xG),   ty(yTop),  'cut'); // left

  // ── Horizontal fold lines
  folds += svgLine(tx(xG), ty(yBody), tx(xEnd), ty(yBody), 'fold');
  folds += svgLine(tx(xG), ty(yBotF), tx(xEnd), ty(yBotF), 'fold');

  // ── Vertical fold lines (panel dividers in body zone)
  [xA1, xB1, xA2, xB2].forEach(x => {
    folds += svgLine(tx(x), ty(yBody), tx(x), ty(yBotF), 'fold');
  });

  // ── Slot lines between adjacent flaps (top + bottom)
  const slotW = CAL + 2;
  [[xA1,true,true],[xB1,true,false],[xA2,false,true],[xB2,true,false]].forEach(([px,lM,rM]) => {
    const sx = tx(px), sw = s(slotW / 2);
    cuts += svgLine(sx-sw, ty(yBody), sx-sw, ty(yTop), 'cut');
    cuts += svgLine(sx+sw, ty(yBody), sx+sw, ty(yTop), 'cut');
    cuts += svgLine(sx-sw, ty(yBotF), sx-sw, ty(yEnd), 'cut');
    cuts += svgLine(sx+sw, ty(yBotF), sx+sw, ty(yEnd), 'cut');
  });

  // ── Simple lock tab on top/bottom of B2 panel (right side)
  const tabW = s(panelB * 0.4);
  const tabH = s(Math.min(topH, botH) * 0.55);
  // top B2 tab
  const btx = tx(xB2 + panelB * 0.3);
  cuts += svgLine(btx,        ty(yBody), btx,          ty(yBody)-tabH, 'cut');
  cuts += svgLine(btx,        ty(yBody)-tabH, btx+tabW, ty(yBody)-tabH, 'cut');
  cuts += svgLine(btx+tabW,   ty(yBody)-tabH, btx+tabW, ty(yBody), 'cut');

  // ── Dimension annotations
  const DY = 14;
  dims += svgDim(tx(xG), ty(yTop)-DY, tx(xEnd), ty(yTop)-DY, `${r(flatW)} mm`, true);
  dims += svgDim(tx(xEnd)+DY, ty(yTop), tx(xEnd)+DY, ty(yEnd), `${r(flatH)} mm`, false);
  dims += svgDim(tx(xA1), ty(yBody + bodyH/2), tx(xB1), ty(yBody + bodyH/2), `${L}`, false, 'L');
  dims += svgDim(tx(xB1), ty(yBody + bodyH/2), tx(xA2), ty(yBody + bodyH/2), `${W}`, false, 'W');
  dims += svgDim(tx(xA2), ty(yBody + bodyH/2), tx(xB2), ty(yBody + bodyH/2), `${L}`, false, 'L');
  dims += svgDim(tx(xB2), ty(yBody + bodyH/2), tx(xEnd), ty(yBody + bodyH/2), `${W}`, false, 'W');
  dims += svgDim(tx(xA1)-DY, ty(yBody), tx(xA1)-DY, ty(yBotF), `${H}`, true, 'D');
  dims += svgDim(tx(xA1)-DY, ty(yTop), tx(xA1)-DY, ty(yBody), `${topH}`, true, 'f');
  if (glue > 0) dims += svgDim(tx(xG), ty(yTop)-DY*2, tx(xA1), ty(yTop)-DY*2, `g:${r(glue)}`, true, 'g');

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${vw}" height="${vh}" style="background:#fff">
  <g id="dims">${dims}</g>
  <g id="fold">${folds}</g>
  <g id="cut">${cuts}</g>
  <text x="${vw/2}" y="14" text-anchor="middle" font-size="11"
    font-family="IBM Plex Mono,monospace" fill="#bbb">飛機盒 Mailer — L${L}×W${W}×H${H} t${CAL}mm</text>
</svg>`;
}

// ---- One-Piece Lid Box SVG (一體式外箱) ----
function genOnePieceSVG(L, W, H, CAL, vw, vh, extra) {
  extra = extra || {};
  const { of: ofVal = 0, gTab = 30, f: fOverride = 0, sl: slOverride = 0 } = extra;
  const d = BOX_LIBRARY[1].calc(L, W, H, CAL, extra);
  const { glue, slotW, panelA_w, panelA_h, panelB_w,
          topFlap_A, dustH, botFlap_A, botFlapMin, flatW, flatH } = d;

  const { scale, ox, oy } = calcScale(flatW, flatH, vw, vh, 80);
  const s  = v => v * scale;
  const tx = v => ox + v * scale;
  const ty = v => oy + v * scale;

  // X column boundaries
  const xGlue = 0;
  const xA1   = glue;
  const xB1   = xA1 + panelA_w;
  const xA2   = xB1 + panelB_w;
  const xB2   = xA2 + panelA_w;
  const xEnd  = xB2 + panelB_w;

  // Y row boundaries
  // Top: A flaps = topFlap_A (large, full top coverage), B flaps = dustH (short dust flap)
  const yTopMaj = 0;                        // top of A panel top flaps
  const yTopMin = topFlap_A - dustH;        // top of B panel dust flaps
  const yPanel  = topFlap_A;               // body top fold line
  const yBotF   = topFlap_A + panelA_h;   // body bottom fold line
  // Bottom: standard RSC with of
  const yBotMaj = flatH;                           // bottom of A panel bottom flaps
  const yBotMin = yBotF + botFlapMin;              // bottom of B panel bottom flaps

  let cuts = '', folds = '', dims = '';

  // ── Outer cut boundary ────────────────────────────────────────────────────
  // Top: glue tab has no flap; stepped at A/B boundaries
  cuts += svgLine(tx(xA1),   ty(yPanel),  tx(xA1),  ty(yTopMaj), 'cut');
  cuts += svgLine(tx(xA1),   ty(yTopMaj), tx(xB1),  ty(yTopMaj), 'cut');
  cuts += svgLine(tx(xB1),   ty(yTopMaj), tx(xB1),  ty(yTopMin), 'cut');
  cuts += svgLine(tx(xB1),   ty(yTopMin), tx(xA2),  ty(yTopMin), 'cut');
  cuts += svgLine(tx(xA2),   ty(yTopMin), tx(xA2),  ty(yTopMaj), 'cut');
  cuts += svgLine(tx(xA2),   ty(yTopMaj), tx(xB2),  ty(yTopMaj), 'cut');
  cuts += svgLine(tx(xB2),   ty(yTopMaj), tx(xB2),  ty(yTopMin), 'cut');
  cuts += svgLine(tx(xB2),   ty(yTopMin), tx(xEnd), ty(yTopMin), 'cut');
  // Right edge
  cuts += svgLine(tx(xEnd),  ty(yTopMin), tx(xEnd), ty(yBotMin), 'cut');
  // Bottom: standard RSC with of offset on B panels
  cuts += svgLine(tx(xEnd),  ty(yBotMin), tx(xB2),  ty(yBotMin), 'cut');
  cuts += svgLine(tx(xB2),   ty(yBotMin), tx(xB2),  ty(yBotMaj), 'cut');
  cuts += svgLine(tx(xB2),   ty(yBotMaj), tx(xA2),  ty(yBotMaj), 'cut');
  cuts += svgLine(tx(xA2),   ty(yBotMaj), tx(xA2),  ty(yBotMin), 'cut');
  cuts += svgLine(tx(xA2),   ty(yBotMin), tx(xB1),  ty(yBotMin), 'cut');
  cuts += svgLine(tx(xB1),   ty(yBotMin), tx(xB1),  ty(yBotMaj), 'cut');
  cuts += svgLine(tx(xB1),   ty(yBotMaj), tx(xA1),  ty(yBotMaj), 'cut');
  cuts += svgLine(tx(xA1),   ty(yBotMaj), tx(xA1),  ty(yBotF),   'cut');
  // Glue tab (body height only, no flaps)
  cuts += svgLine(tx(xA1),   ty(yBotF),   tx(xGlue),ty(yBotF),   'cut');
  cuts += svgLine(tx(xGlue), ty(yBotF),   tx(xGlue),ty(yPanel),  'cut');
  cuts += svgLine(tx(xGlue), ty(yPanel),  tx(xA1),  ty(yPanel),  'cut');

  // ── Vertical fold lines (body zone only) ──────────────────────────────────
  [xA1, xB1, xA2, xB2].forEach(x => {
    folds += svgLine(tx(x), ty(yPanel), tx(x), ty(yBotF), 'fold');
  });

  // ── Horizontal fold lines ─────────────────────────────────────────────────
  folds += svgLine(tx(xA1), ty(yPanel), tx(xEnd), ty(yPanel), 'fold');
  folds += svgLine(tx(xA1), ty(yBotF),  tx(xEnd), ty(yBotF),  'fold');

  // ── Bottom slot cuts only (top is full-overlap, no slots needed) ──────────
  const slotDefs = [
    [xB1, true,  false],   // A1 ↔ B1
    [xA2, false, true ],   // B1 ↔ A2
    [xB2, true,  false],   // A2 ↔ B2
  ];
  slotDefs.forEach(([px, lMaj, rMaj]) => {
    const sx = tx(px), sw = s(slotW / 2);
    cuts += svgLine(sx - sw, ty(yBotF), sx - sw, ty(lMaj ? yBotMaj : yBotMin), 'cut');
    cuts += svgLine(sx + sw, ty(yBotF), sx + sw, ty(rMaj ? yBotMaj : yBotMin), 'cut');
  });

  // ── Dimension annotations ─────────────────────────────────────────────────
  const DY = 14;
  dims += svgDim(tx(xGlue), ty(yTopMaj)-DY,   tx(xEnd), ty(yTopMaj)-DY,   `${r(flatW)} mm`, true);
  dims += svgDim(tx(xEnd)+DY, ty(yTopMaj),    tx(xEnd)+DY, ty(yBotMaj),   `${r(flatH)} mm`, false);
  dims += svgDim(tx(xA1), ty(yPanel+panelA_h/2), tx(xB1), ty(yPanel+panelA_h/2), `${L}`, false, 'L');
  dims += svgDim(tx(xB1), ty(yPanel+panelA_h/2), tx(xA2), ty(yPanel+panelA_h/2), `${W}`, false, 'W');
  dims += svgDim(tx(xA2), ty(yPanel+panelA_h/2), tx(xB2), ty(yPanel+panelA_h/2), `${L}`, false, 'L');
  dims += svgDim(tx(xB2), ty(yPanel+panelA_h/2), tx(xEnd), ty(yPanel+panelA_h/2), `${W}`, false, 'W');
  dims += svgDim(tx(xA1)-DY, ty(yPanel),      tx(xA1)-DY, ty(yBotF),      `${H}`, true, 'D');
  // Top A flap height (large)
  dims += svgDim(tx(xA1)-DY, ty(yTopMaj),     tx(xA1)-DY, ty(yPanel),     `${topFlap_A}`, true, 'f');
  // Top B dust flap height
  dims += svgDim(tx(xB1)+4,  ty(yTopMin),     tx(xB1)+4,  ty(yPanel),     `${dustH}`, false);
  // Bottom A flap height
  dims += svgDim(tx(xA2)-DY, ty(yBotF),       tx(xA2)-DY, ty(yBotMaj),   `${botFlap_A}`, true);
  // Bottom B flap height
  if (ofVal > 0) dims += svgDim(tx(xB1)+4, ty(yBotMin), tx(xB1)+4, ty(yBotF), `${botFlapMin}`, false, 'of');
  // Slot width
  dims += svgDim(tx(xB1-slotW/2), ty(yBotMin+(yBotMaj-yBotMin)/2),
                 tx(xB1+slotW/2), ty(yBotMin+(yBotMaj-yBotMin)/2), `sl:${r(slotW)}`, false, 'sl');
  // Glue tab
  dims += svgDim(tx(xGlue), ty(yPanel)-DY,    tx(xA1),   ty(yPanel)-DY,   `g:${glue}`, true, 'g');

  return `<svg xmlns="http://www.w3.org/2000/svg" width="${vw}" height="${vh}" style="background:#fff">
  <g id="dims">${dims}</g>
  <g id="fold">${folds}</g>
  <g id="cut">${cuts}</g>
</svg>`;
}

// THREE.JS 3D
// ============================================================
let renderer, scene, camera, controls, animFrameId;

function initThree() {
  const canvas = document.getElementById('threejs-canvas');
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setClearColor(0xf8f8f8, 1);

  scene = new THREE.Scene();

  const ca = document.getElementById('canvas-area');
  const w = ca.clientWidth, h = ca.clientHeight;
  camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 10000);
  camera.position.set(500, 400, 600);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // Lights
  _ambLight = new THREE.AmbientLight(0xffffff, 0.7);
  scene.add(_ambLight);
  _dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
  _dirLight.position.set(1, 2, 1).normalize();
  scene.add(_dirLight);
  const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
  fillLight.position.set(-1, 0.5, -1).normalize();
  scene.add(fillLight);

  resizeRenderer();
  animate();
}

function animate() {
  animFrameId = requestAnimationFrame(animate);
  controls.update();
  if (_autoSpinActive && scene) {
    scene.children.forEach(c => { if (c.userData.isBoxModel) c.rotation.y += 0.008; });
  }
  renderer.render(scene, camera);
}

function resizeRenderer() {
  const ca = document.getElementById('canvas-area');
  const w = ca.clientWidth, h = ca.clientHeight;
  renderer.setSize(w, h);
  if (camera) {
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
}

function clearScene() {
  if (!scene) return;
  const toRemove = scene.children.filter(c => c.userData.isBoxModel);
  toRemove.forEach(c => scene.remove(c));
}

function render3D() {
  clearScene();
  const { L, W, H, CAL, f: fVal } = getInputs();
  const box = BOX_LIBRARY[currentBoxIdx];
  box.build3D(L, W, H, CAL, scene, fVal);
  // Point camera at box centre & fit distance
  if (controls) {
    const dim = Math.max(L, W, H);
    controls.target.set(0, H / 2, 0);
    camera.position.set(dim * 1.4, dim * 1.0, dim * 1.8);
    controls.update();
  }
}

// ============================================================
// FOLD ANIMATION
// ============================================================
window._foldState = { t: 0 };
window._flapPivots = null;
let _foldTween = null;
let _autoSpinActive = false;

// ease in-out cubic
function _eio(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2; }

function _applyFoldAngle(t) {
  const hinges = window._hinges;
  const fp = window._flapPivots;
  if (!hinges || !fp) return;

  // ── PHASE 1 (t: 0 → 0.5): Y-axis chain fold — vertical blank → tube ──────
  // Each hinge rotates -π/2 around Y. Because the hinges are chained (each is a
  // child of the previous panel), every panel folds 90° relative to its neighbour,
  // wrapping the strip into a rectangular tube.
  const e1 = _eio(Math.min(t / 0.5, 1));
  const ya  = -Math.PI / 2 * e1;   // 0 → -π/2
  hinges.B1.rotation.y = ya;
  hinges.A2.rotation.y = ya;
  hinges.B2.rotation.y = ya;

  // ── PHASE 2 (t: 0.5 → 1.0): Flap closure ────────────────────────────────
  // Minor flaps (B1/B2 — left/right): close first, t: 0.50 → 0.78
  const tMinor = _eio(Math.max(0, Math.min((t - 0.5)  / 0.28, 1)));
  // Major flaps (A1/A2 — front/back): close after,  t: 0.64 → 1.00
  const tMajor = _eio(Math.max(0, Math.min((t - 0.64) / 0.36, 1)));

  // All panels: top flap closed = rotation.x → +π/2 (fold inward over top opening)
  //             bot flap closed = rotation.x → -π/2 (fold inward under bottom)
  fp.top.A1.rotation.x    =  Math.PI / 2 * tMajor;
  fp.top.A2.rotation.x    =  Math.PI / 2 * tMajor;
  fp.top.B1.rotation.x    =  Math.PI / 2 * tMinor;
  fp.top.B2.rotation.x    =  Math.PI / 2 * tMinor;
  fp.bot.A1.rotation.x    = -Math.PI / 2 * tMajor;
  fp.bot.A2.rotation.x    = -Math.PI / 2 * tMajor;
  fp.bot.B1.rotation.x    = -Math.PI / 2 * tMinor;
  fp.bot.B2.rotation.x    = -Math.PI / 2 * tMinor;
}

// ============================================================
// PARAMETER PANEL — detail toggle + dim-label click highlight
// ============================================================
let _detailVisible = true;
function toggleDetailParams() {
  _detailVisible = !_detailVisible;
  const sec = document.getElementById('pt-detail-section');
  const btn = document.getElementById('btn-toggle-detail');
  if (sec) sec.classList.toggle('hidden', !_detailVisible);
  if (btn) btn.textContent = _detailVisible ? '隱藏細節參數' : '顯示細節參數';
}

// Called from SVG dim-label onclick to scroll + flash the matching row
function highlightParam(code) {
  const row = document.getElementById('pr-' + code);
  if (!row) return;

  // Expand detail section if the row lives inside it
  const detail = document.getElementById('pt-detail-section');
  if (detail && detail.contains(row) && !_detailVisible) toggleDetailParams();

  // Remove any existing flash
  document.querySelectorAll('.pt-row.flash').forEach(r => r.classList.remove('flash'));

  // Flash + scroll
  row.classList.add('flash');
  row.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  // Focus the editable input (not readonly)
  const inp = row.querySelector('input:not([readonly])');
  if (inp) { setTimeout(() => inp.focus(), 300); }

  setTimeout(() => row.classList.remove('flash'), 1800);
}

function setFoldProgress(t) {
  window._foldState.t = Math.max(0, Math.min(1, t));
  _applyFoldAngle(window._foldState.t);
  const slider = document.getElementById('fold-slider');
  if (slider) slider.value = Math.round(window._foldState.t * 100);
}

function onFoldSlider(val) {
  if (_foldTween) { _foldTween.kill(); _foldTween = null; }
  document.getElementById('btn-play').textContent = '▶ 播放';
  document.getElementById('btn-play').classList.remove('playing');
  setFoldProgress(val / 100);
}

function toggleFoldAnim() {
  if (!window._flapPivots) {
    notify('此盒型不支援折疊動畫'); return;
  }
  if (_foldTween && _foldTween.isActive()) {
    _foldTween.pause();
    document.getElementById('btn-play').textContent = '▶ 播放';
    document.getElementById('btn-play').classList.remove('playing');
    return;
  }
  const speed = parseFloat(document.getElementById('speed-slider').value) || 1.5;
  const totalDur = 3.5 / speed;
  // If already at end, reverse; if paused mid-way, resume forward
  const startT = window._foldState.t;
  const targetT = startT >= 0.99 ? 0 : 1;
  const dur = totalDur * Math.abs(targetT - startT);
  document.getElementById('btn-play').textContent = '⏸ 暫停';
  document.getElementById('btn-play').classList.add('playing');
  _foldTween = gsap.to(window._foldState, {
    t: targetT,
    duration: dur,
    ease: 'none',  // easing handled inside _applyFoldAngle per phase
    onUpdate: () => setFoldProgress(window._foldState.t),
    onComplete: () => {
      document.getElementById('btn-play').textContent = '▶ 播放';
      document.getElementById('btn-play').classList.remove('playing');
      _foldTween = null;
    }
  });
}

function resetFoldAnim() {
  if (_foldTween) { _foldTween.kill(); _foldTween = null; }
  document.getElementById('btn-play').textContent = '▶ 播放';
  document.getElementById('btn-play').classList.remove('playing');
  setFoldProgress(0);
}

function toggleAutoSpin() {
  _autoSpinActive = !_autoSpinActive;
  document.getElementById('btn-autospin').classList.toggle('playing', _autoSpinActive);
}

const CARDBOARD_COLORS = [
  { hex: '#D4A574', v: 0xD4A574 },
  { hex: '#F5EED6', v: 0xF5EED6 },
  { hex: '#C8A84B', v: 0xC8A84B },
  { hex: '#AAAAAA', v: 0xAAAAAA },
  { hex: '#8B6347', v: 0x8B6347 },
  { hex: '#DDDDDD', v: 0xDDDDDD },
  { hex: '#4A7C59', v: 0x4A7C59 },
  { hex: '#C0392B', v: 0xC0392B },
];
let _activeColorIdx = 0;

function initColorSwatches() {
  const container = document.getElementById('color-swatches');
  CARDBOARD_COLORS.forEach((c, i) => {
    const el = document.createElement('div');
    el.className = 'swatch' + (i === 0 ? ' active' : '');
    el.style.background = c.hex;
    el.title = c.hex;
    el.onclick = () => setCardboardColor(i);
    container.appendChild(el);
  });
}

function setCardboardColor(idx) {
  _activeColorIdx = idx;
  document.querySelectorAll('.swatch').forEach((el, i) =>
    el.classList.toggle('active', i === idx));
  const col = new THREE.Color(CARDBOARD_COLORS[idx].v);
  CARDBOARD.color.set(col);
  CARDBOARD_EDGE.color.set(col.clone().multiplyScalar(0.82));
}

const CARDBOARD = new THREE.MeshLambertMaterial({ color: 0xD4A574, side: THREE.DoubleSide });
const CARDBOARD_EDGE = new THREE.MeshLambertMaterial({ color: 0xB8895A, side: THREE.DoubleSide });

function makePanel(w, h, mat) {
  const geo = new THREE.BoxGeometry(w, h, 2);
  return new THREE.Mesh(geo, mat || CARDBOARD);
}

function addPanel(parent, w, h, x, y, z, rx, ry, rz) {
  const m = makePanel(w, h);
  m.position.set(x, y, z);
  if (rx) m.rotation.x = rx;
  if (ry) m.rotation.y = ry;
  if (rz) m.rotation.z = rz;
  (parent || scene).add(m);
  return m;
}

// 0201 3D — Y-axis chain fold animation.
//
// FLAT STATE (t=0): all panels stand vertically in XY plane as one linear strip.
//   Strip order (left→right): A1 (front,L) | B1 (left,W) | A2 (back,L) | B2 (right,W)
//   Box height H along Y, panel thickness T along Z.
//
// PHASE 1 (t:0→0.5): Y-axis chain fold.  Each hinge rotates -π/2, wrapping
//   the strip into a rectangular tube.  Chain: A1 is the anchor; B1 hinges at
//   A1's right edge; A2 hinges at B1's far edge; B2 hinges at A2's far edge.
//
// PHASE 2 (t:0.5→1.0): Flap closure (minor B1/B2 first, then major A1/A2).
//   Top flaps: rotation.x → +π/2   Bottom flaps: rotation.x → -π/2
//
// No static bottom — RSC 0201 bottom is formed by flap closure.
function build0201_3D(L, W, H, CAL, scene, fVal) {
  const T  = 4;
  const fd = (fVal && fVal > 0) ? fVal : Math.round(W / 2);
  const mat  = CARDBOARD;
  const matF = CARDBOARD_EDGE;
  const scoreMat = new THREE.LineBasicMaterial({ color: 0x555555, linewidth: 1 });

  const group = new THREE.Group();
  group.userData.isBoxModel = true;
  // Offset so the erected tube is centred at world origin.
  // After fold: tube occupies group x:[0,L], z:[0,W] → centre (L/2,0,W/2) → shift by (-L/2,0,-W/2)
  group.position.set(-L / 2, 0, -W / 2);

  // ── PANEL FACTORY ────────────────────────────────────────────────────────
  // Builds a panel group whose LEFT edge sits at local x=0.
  // Panel mesh: panelW × H × T, centred at (panelW/2, H/2, 0).
  // Score lines at y=0 and y=H on the outer face (z = +T/2+0.5).
  // Top flap pivot at (panelW/2, H,  0) — mesh extends +Y by fd from pivot.
  // Bot flap pivot at (panelW/2, 0,  0) — mesh extends -Y by fd from pivot.
  function makePanelGroup(panelW) {
    const pg = new THREE.Group();

    // Panel surface
    const pm = new THREE.Mesh(new THREE.BoxGeometry(panelW, H, T), mat);
    pm.position.set(panelW / 2, H / 2, 0);
    pg.add(pm);

    // Score lines (fold creases at top and bottom of panel)
    const sz = T / 2 + 0.5;
    [0, H].forEach(yLine => {
      const pts = [
        new THREE.Vector3(0,       yLine, sz),
        new THREE.Vector3(panelW,  yLine, sz),
      ];
      pg.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), scoreMat));
    });

    // Top flap: pivot at panel centre-top, mesh hangs upward
    const tfp = new THREE.Group();
    tfp.position.set(panelW / 2, H, 0);
    const tfm = new THREE.Mesh(new THREE.BoxGeometry(panelW - T * 2, fd, T), matF);
    tfm.position.set(0, fd / 2, 0);
    tfp.add(tfm);
    pg.add(tfp);

    // Bottom flap: pivot at panel centre-bottom, mesh hangs downward
    const bfp = new THREE.Group();
    bfp.position.set(panelW / 2, 0, 0);
    const bfm = new THREE.Mesh(new THREE.BoxGeometry(panelW - T * 2, fd, T), matF);
    bfm.position.set(0, -fd / 2, 0);
    bfp.add(bfm);
    pg.add(bfp);

    return { pg, tfp, bfp };
  }

  // ── BUILD CHAIN: A1 → B1 → A2 → B2 ──────────────────────────────────────
  const { pg: pgA1, tfp: tfA1, bfp: bfA1 } = makePanelGroup(L);
  group.add(pgA1);

  const hingeB1 = new THREE.Group();
  hingeB1.position.set(L, 0, 0);
  pgA1.add(hingeB1);
  const { pg: pgB1, tfp: tfB1, bfp: bfB1 } = makePanelGroup(W);
  hingeB1.add(pgB1);

  const hingeA2 = new THREE.Group();
  hingeA2.position.set(W, 0, 0);
  pgB1.add(hingeA2);
  const { pg: pgA2, tfp: tfA2, bfp: bfA2 } = makePanelGroup(L);
  hingeA2.add(pgA2);

  const hingeB2 = new THREE.Group();
  hingeB2.position.set(L, 0, 0);
  pgA2.add(hingeB2);
  const { pg: pgB2, tfp: tfB2, bfp: bfB2 } = makePanelGroup(W);
  hingeB2.add(pgB2);

  scene.add(group);

  window._wallPivots = null;  // legacy ref — no longer used
  window._hinges     = { B1: hingeB1, A2: hingeA2, B2: hingeB2 };
  window._flapPivots = {
    top: { A1: tfA1, B1: tfB1, A2: tfA2, B2: tfB2 },
    bot: { A1: bfA1, B1: bfB1, A2: bfA2, B2: bfB2 },
  };
  window._foldState  = window._foldState || { t: 0 };
  _applyFoldAngle(window._foldState.t);
}

// One-Piece Lid 3D — same chain-fold animation as 0201
// Top A flaps depth = W (large), Top B flaps depth = dustH (small dust flap)
// Bottom flaps = W/2 (standard RSC)
function buildOnePiece3D(L, W, H, CAL, scene) {
  const T       = 4;
  const topFd_A = W;
  const topFd_B = Math.max(20, Math.round(W / 6));
  const botFd   = Math.round(W / 2);
  const mat     = CARDBOARD;
  const matF    = CARDBOARD_EDGE;
  const scoreMat = new THREE.LineBasicMaterial({ color: 0x555555, linewidth: 1 });

  const group = new THREE.Group();
  group.userData.isBoxModel = true;
  group.position.set(-L / 2, 0, -W / 2);

  function makePanelGroup(panelW, tfd, bfd) {
    const pg = new THREE.Group();
    const pm = new THREE.Mesh(new THREE.BoxGeometry(panelW, H, T), mat);
    pm.position.set(panelW / 2, H / 2, 0);
    pg.add(pm);
    const sz = T / 2 + 0.5;
    [0, H].forEach(yLine => {
      const pts = [new THREE.Vector3(0, yLine, sz), new THREE.Vector3(panelW, yLine, sz)];
      pg.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), scoreMat));
    });
    const tfp = new THREE.Group();
    tfp.position.set(panelW / 2, H, 0);
    const tfm = new THREE.Mesh(new THREE.BoxGeometry(panelW - T * 2, tfd, T), matF);
    tfm.position.set(0, tfd / 2, 0);
    tfp.add(tfm);
    pg.add(tfp);
    const bfp = new THREE.Group();
    bfp.position.set(panelW / 2, 0, 0);
    const bfm = new THREE.Mesh(new THREE.BoxGeometry(panelW - T * 2, bfd, T), matF);
    bfm.position.set(0, -bfd / 2, 0);
    bfp.add(bfm);
    pg.add(bfp);
    return { pg, tfp, bfp };
  }

  const { pg: pgA1, tfp: tfA1, bfp: bfA1 } = makePanelGroup(L, topFd_A, botFd);
  group.add(pgA1);
  const hingeB1 = new THREE.Group(); hingeB1.position.set(L, 0, 0); pgA1.add(hingeB1);
  const { pg: pgB1, tfp: tfB1, bfp: bfB1 } = makePanelGroup(W, topFd_B, botFd);
  hingeB1.add(pgB1);
  const hingeA2 = new THREE.Group(); hingeA2.position.set(W, 0, 0); pgB1.add(hingeA2);
  const { pg: pgA2, tfp: tfA2, bfp: bfA2 } = makePanelGroup(L, topFd_A, botFd);
  hingeA2.add(pgA2);
  const hingeB2 = new THREE.Group(); hingeB2.position.set(L, 0, 0); pgA2.add(hingeB2);
  const { pg: pgB2, tfp: tfB2, bfp: bfB2 } = makePanelGroup(W, topFd_B, botFd);
  hingeB2.add(pgB2);

  scene.add(group);
  window._hinges     = { B1: hingeB1, A2: hingeA2, B2: hingeB2 };
  window._flapPivots = {
    top: { A1: tfA1, B1: tfB1, A2: tfA2, B2: tfB2 },
    bot: { A1: bfA1, B1: bfB1, A2: bfA2, B2: bfB2 },
  };
  window._foldState = window._foldState || { t: 0 };
  _applyFoldAngle(window._foldState.t);
}

// 0300 3D - tray assembled
function build0300_3D(L, W, H, CAL, scene) {
  const group = new THREE.Group();
  const T = 2;
  // Bottom
  const bottom = new THREE.Mesh(new THREE.BoxGeometry(L, W, T), CARDBOARD);
  bottom.rotation.x = Math.PI / 2;
  group.add(bottom);
  // Four sides
  const sides = [
    { size: [L, H, T], pos: [0, H/2, W/2], rot: [0, 0, 0] },
    { size: [L, H, T], pos: [0, H/2, -W/2], rot: [0, 0, 0] },
    { size: [W, H, T], pos: [-L/2, H/2, 0], rot: [0, Math.PI/2, 0] },
    { size: [W, H, T], pos: [L/2, H/2, 0], rot: [0, Math.PI/2, 0] },
  ];
  sides.forEach(({ size, pos, rot }) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(...size), CARDBOARD);
    m.position.set(...pos);
    m.rotation.set(...rot);
    group.add(m);
  });
  group.position.y = H / 2;
  group.userData.isBoxModel = true;
  scene.add(group);
}

// 0401 3D - lid and base slightly separated
function build0401_3D(L, W, H, CAL, scene) {
  const d = BOX_LIBRARY[2].calc(L, W, H, CAL);
  const { lidH, baseH } = d;
  const T = 2;
  const sep = 30; // separation between lid and base

  // BASE group
  const base = new THREE.Group();
  const bBottom = new THREE.Mesh(new THREE.BoxGeometry(L, W, T), CARDBOARD);
  bBottom.rotation.x = Math.PI / 2;
  base.add(bBottom);
  [[L, baseH, 0, baseH/2, W/2, 0], [L, baseH, 0, baseH/2, -W/2, 0],
   [W, baseH, Math.PI/2, baseH/2, 0, -L/2], [W, baseH, Math.PI/2, baseH/2, 0, L/2]
  ].forEach(([sw, sh, ry, py, pz, px]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sw, sh, T), CARDBOARD);
    m.rotation.y = ry;
    m.position.set(px, py, pz);
    base.add(m);
  });
  base.position.y = baseH / 2;
  base.userData.isBoxModel = true;
  scene.add(base);

  // LID group (slightly above, inverted)
  const lid = new THREE.Group();
  const lidL2 = L + 2 * CAL, lidW2 = W + 2 * CAL;
  const lBottom = new THREE.Mesh(new THREE.BoxGeometry(lidL2, lidW2, T), CARDBOARD_EDGE);
  lBottom.rotation.x = Math.PI / 2;
  lid.add(lBottom);
  [[lidL2, lidH, 0, lidH/2, lidW2/2, 0], [lidL2, lidH, 0, lidH/2, -lidW2/2, 0],
   [lidW2, lidH, Math.PI/2, lidH/2, 0, -lidL2/2], [lidW2, lidH, Math.PI/2, lidH/2, 0, lidL2/2]
  ].forEach(([sw, sh, ry, py, pz, px]) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(sw, sh, T), CARDBOARD_EDGE);
    m.rotation.y = ry;
    m.position.set(px, py, pz);
    lid.add(m);
  });
  // Lid sits above the base
  lid.position.y = baseH + sep + lidH;
  lid.rotation.x = Math.PI; // flipped
  lid.position.y = baseH + sep;
  lid.userData.isBoxModel = true;
  scene.add(lid);
}

function setCam(preset) {
  if (!camera || !controls) return;
  const { L, W, H } = getInputs();
  const d = Math.max(L, W, H) * 2.5;
  switch (preset) {
    case 'front':
      camera.position.set(0, H, d);
      camera.up.set(0, 1, 0);
      break;
    case 'side':
      camera.position.set(d, H, 0);
      camera.up.set(0, 1, 0);
      break;
    case 'top':
      camera.position.set(0, d, 0.01);
      camera.up.set(0, 0, -1);
      break;
    case 'flat':
      setView('svg');
      return;
  }
  controls.target.set(0, H / 2, 0);
  controls.update();
}

// ============================================================
// EXPORT: DXF
// ============================================================
function exportDXF() {
  const { L, W, H, CAL } = getInputs();
  const box = BOX_LIBRARY[currentBoxIdx];

  // Get SVG lines for DXF conversion
  const svgStr = box.svgGen(L, W, H, CAL, 1000, 700);
  const parser = new DOMParser();
  const doc = parser.parseFromString(svgStr, 'image/svg+xml');

  let entities = '';

  function addLine(x1, y1, x2, y2, layer) {
    entities += `0\nLINE\n8\n${layer}\n10\n${x1.toFixed(4)}\n20\n${(-y1).toFixed(4)}\n30\n0.0\n11\n${x2.toFixed(4)}\n21\n${(-y2).toFixed(4)}\n31\n0.0\n`;
  }

  // Parse cut group
  const cutG = doc.getElementById('cut');
  const foldG = doc.getElementById('fold');

  function processGroup(g, layer) {
    if (!g) return;
    g.querySelectorAll('line').forEach(el => {
      addLine(+el.getAttribute('x1'), +el.getAttribute('y1'),
               +el.getAttribute('x2'), +el.getAttribute('y2'), layer);
    });
  }

  processGroup(cutG, '0');
  processGroup(foldG, 'FOLD');

  const dxf = `0\nSECTION\n2\nHEADER\n9\n$ACADVER\n1\nAC1009\n0\nENDSEC\n0\nSECTION\n2\nTABLES\n0\nTABLE\n2\nLAYER\n70\n2\n0\nLAYER\n2\n0\n70\n0\n62\n1\n6\nCONTINUOUS\n0\nLAYER\n2\nFOLD\n70\n0\n62\n5\n6\nDASHED\n0\nENDTAB\n0\nENDSEC\n0\nSECTION\n2\nENTITIES\n${entities}0\nENDSEC\n0\nEOF\n`;

  const blob = new Blob([dxf], { type: 'application/octet-stream' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${box.code}_${L}x${W}x${H}_CAL${CAL}.dxf`;
  a.click();
  notify('DXF 已匯出');
}

// ============================================================
// EXPORT: PDF
// ============================================================
function exportPDF() {
  const { L, W, H, CAL } = getInputs();
  const box = BOX_LIBRARY[currentBoxIdx];
  const { jsPDF } = window.jspdf;
  const doc2 = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  const pw = 210, ph = 297;

  // Header
  doc2.setFont('helvetica', 'bold');
  doc2.setFontSize(14);
  doc2.text(box.label, 15, 18);
  doc2.setFont('helvetica', 'normal');
  doc2.setFontSize(9);
  doc2.text(`Generated: ${new Date().toLocaleString()}`, 15, 25);
  doc2.text(`Dimensions: L${L} × W${W} × H${H} mm  CAL: ${CAL}mm`, 15, 30);

  // SVG to canvas to PDF
  const svgStr = box.svgGen(L, W, H, CAL, 750, 500);
  const blob = new Blob([svgStr], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = function() {
    const cv = document.createElement('canvas');
    cv.width = 750; cv.height = 500;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, 750, 500);
    ctx.drawImage(img, 0, 0);
    const imgData = cv.toDataURL('image/png');
    doc2.addImage(imgData, 'PNG', 15, 35, pw - 30, (pw - 30) * 500 / 750);

    // Dimension table
    let yy = 35 + (pw - 30) * 500 / 750 + 8;
    doc2.setFontSize(10);
    doc2.setFont('helvetica', 'bold');
    doc2.text('計算結果', 15, yy);
    yy += 6;
    doc2.setFont('helvetica', 'normal');
    doc2.setFontSize(9);
    if (calcData && calcData.rows) {
      calcData.rows.forEach(([label, val]) => {
        doc2.text(`${label}: ${val} mm`, 18, yy);
        yy += 5;
      });
    }
    doc2.save(`${box.code}_${L}x${W}x${H}_CAL${CAL}.pdf`);
    URL.revokeObjectURL(url);
    notify('PDF 已匯出');
  };
  img.src = url;
}

        !box.nameEN.toLowerCase().includes(q)) return;
    const card = document.createElement('div');

    <line x1="18" y1="13" x2="18" y2="42" stroke="#4361EE" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="36" y1="13" x2="36" y2="42" stroke="#4361EE" stroke-width="1" stroke-dasharray="4,2"/>
    <line x1="56" y1="13" x2="56" y2="42" stroke="#4361EE" stroke-width="1" stroke-dasharray="4,2"/>
  </svg>`;
  return `<svg viewBox="0 0 80 55" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="10" width="60" height="35" stroke="#888" stroke-width="1.5"/>
    <text x="40" y="31" text-anchor="middle" font-size="9" fill="#888">?</text>
  </svg>`;
}

function selectBox(i) {
  currentBoxIdx = i;
  updateAll();
}

function closeOverlay(id) {
  document.getElementById(id).classList.remove('show');
}

// ============================================================
// HISTORY
// ============================================================
const HIST_KEY = 'boxlib_history';
let historyEnabled = true;

function saveHistory(L, W, H, CAL, boxCode) {
  try {
    let hist = JSON.parse(localStorage.getItem(HIST_KEY) || '[]');
    const entry = { id: Date.now(), boxCode, L, W, H, CAL, timestamp: new Date().toISOString() };
    // Avoid duplicates
    hist = hist.filter(e => !(e.boxCode === boxCode && e.L === L && e.W === W && e.H === H && e.CAL === CAL));
    hist.unshift(entry);
    if (hist.length > 50) hist = hist.slice(0, 50);
    localStorage.setItem(HIST_KEY, JSON.stringify(hist));
  } catch (e) {
    historyEnabled = false;
  }
}

function showHistory() {
  renderHistoryList();
  document.getElementById('overlay-hist').classList.add('show');
}

function renderHistoryList() {
  const container = document.getElementById('hist-list');
  if (!historyEnabled) {
    container.innerHTML = '<div style="color:#E63946;font-size:12px;padding:8px">⚠ localStorage 不可用（私密模式？）</div>';
    return;
  }
  let hist = [];
  try { hist = JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch(e) {}
  if (hist.length === 0) {
    container.innerHTML = '<div style="color:#aaa;font-size:12px;padding:8px;text-align:center">暫無歷史記錄</div>';
    return;
  }
  container.innerHTML = hist.map(e => `
    <div class="hist-entry" onclick="loadHistory('${e.id}')">
      <div class="hist-info">
        <div class="hist-code">${e.boxCode}</div>
        <div class="hist-dims">L${e.L} × W${e.W} × H${e.H}  CAL${e.CAL}mm</div>
        <div class="hist-time">${new Date(e.timestamp).toLocaleString()}</div>
      </div>
      <button class="hist-del" onclick="event.stopPropagation();deleteHistory('${e.id}')">✕</button>
    </div>
  `).join('');
}

function loadHistory(id) {
  try {
    const hist = JSON.parse(localStorage.getItem(HIST_KEY) || '[]');
    const e = hist.find(h => String(h.id) === String(id));
    if (!e) return;
    const boxIdx = BOX_LIBRARY.findIndex(b => b.code === e.boxCode);
    if (boxIdx >= 0) currentBoxIdx = boxIdx;
    document.getElementById('inp-L').value = e.L;
    document.getElementById('inp-W').value = e.W;
    document.getElementById('inp-H').value = e.H;
    document.getElementById('inp-CAL').value = e.CAL;
    closeOverlay('overlay-hist');
    updateAll();
  } catch(err) {}
}

function deleteHistory(id) {
  try {
    let hist = JSON.parse(localStorage.getItem(HIST_KEY) || '[]');
    hist = hist.filter(e => String(e.id) !== String(id));
    localStorage.setItem(HIST_KEY, JSON.stringify(hist));
    renderHistoryList();
  } catch(e) {}
}

function clearHistory() {
  if (!confirm('確定要清除全部歷史記錄？')) return;
  try { localStorage.removeItem(HIST_KEY); } catch(e) {}
  renderHistoryList();
  notify('歷史記錄已清除');
}

// ============================================================
// NOTIFICATION
// ============================================================
function notify(msg) {
  const el = document.getElementById('notify');
  el.textContent = msg;
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 2000);
}

// ============================================================
// INIT
// ============================================================
window.addEventListener('DOMContentLoaded', () => {
  // Input listeners
  ['inp-L','inp-W','inp-H','inp-t','inp-of','inp-g','inp-f','inp-sl'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', onInputChange);
  });

  // Close overlays on backdrop click
  document.querySelectorAll('.overlay').forEach(el => {
    el.addEventListener('click', e => {
      if (e.target === el) el.classList.remove('show');
    });
  });

  // Resize handler
  window.addEventListener('resize', () => {
    resizeRenderer();
    if (currentView === 'svg') renderSVG();
  });

  // Init color swatches
  initColorSwatches();

  // Init Three.js
  initThree();

  // Initial calculation
  updateAll();

  // Panel resize drag
  (function() {
    const handle = document.getElementById('panel-resize');
    const panel  = document.getElementById('right-panel');
    let dragging = false, startX = 0, startW = 0;
    handle.addEventListener('mousedown', e => {
      dragging = true; startX = e.clientX; startW = panel.offsetWidth;
      handle.classList.add('dragging');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      const delta = startX - e.clientX;   // drag left = wider
      const newW  = Math.min(Math.max(startW + delta, 200), 520);
      panel.style.width = newW + 'px';
    });
    document.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      handle.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
    });
  })();
});
</script>
